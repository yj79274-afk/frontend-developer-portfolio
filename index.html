<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <main class="app-shell">
        <section class="settings-section" aria-labelledby="settings-title">
            <div class="settings-header">
                <div>
                    <p class="eyebrow">Account Preferences</p>
                    <h1 id="settings-title">Settings</h1>
                </div>
                <span class="avatar" aria-hidden="true">AM</span>
            </div>

            <form class="settings-form" id="settings-form" novalidate>
                <section class="form-card">
                    <div class="form-heading">
                        <div>
                            <h2>Profile Settings</h2>
                            <p class="subtle-text">Update your public profile and workspace preferences.</p>
                        </div>
                    </div>

                    <div class="field-grid">
                        <div class="form-field full-width">
                            <label for="full-name">Full name <span aria-hidden="true">*</span></label>
                            <input type="text" id="full-name" name="fullName" autocomplete="name" required minlength="2"
                                aria-required="true" aria-describedby="full-name-error" />
                            <span class="error-message" id="full-name-error" aria-live="polite"></span>
                        </div>

                        <div class="form-field full-width">
                            <label for="email">Email address <span aria-hidden="true">*</span></label>
                            <input type="email" id="email" name="email" autocomplete="email" required
                                aria-required="true" aria-describedby="email-error" />
                            <span class="error-message" id="email-error" aria-live="polite"></span>
                        </div>

                        <div class="form-field">
                            <label for="timezone">Timezone <span aria-hidden="true">*</span></label>
                            <select id="timezone" name="timezone" required aria-required="true"
                                aria-describedby="timezone-error">
                                <option value="">Choose a timezone</option>
                                <option value="UTC-08">Pacific Time (UTC-08)</option>
                                <option value="UTC-05">Eastern Time (UTC-05)</option>
                                <option value="UTC">Coordinated Universal Time (UTC)</option>
                                <option value="UTC+01">Central European Time (UTC+01)</option>
                                <option value="UTC+05:30">India Standard Time (UTC+05:30)</option>
                            </select>
                            <span class="error-message" id="timezone-error" aria-live="polite"></span>
                        </div>

                        <div class="form-field">
                            <label for="language">Language <span aria-hidden="true">*</span></label>
                            <select id="language" name="language" required aria-required="true"
                                aria-describedby="language-error">
                                <option value="">Choose a language</option>
                                <option value="en">English</option>
                                <option value="es">Spanish</option>
                                <option value="fr">French</option>
                                <option value="de">German</option>
                            </select>
                            <span class="error-message" id="language-error" aria-live="polite"></span>
                        </div>

                        <div class="form-field bio-field full-width">
                            <div class="label-row">
                                <label for="bio">Bio</label>
                                <span class="counter" id="bio-counter" aria-live="polite">0 / 250</span>
                            </div>
                            <textarea id="bio" name="bio" rows="5" maxlength="250"
                                aria-describedby="bio-error bio-counter"></textarea>
                            <span class="error-message" id="bio-error" aria-live="polite"></span>
                        </div>
                    </div>

                    <div class="action-row">
                        <button type="reset" class="button button-secondary">Reset</button>
                        <button type="submit" class="button button-primary">Save preferences</button>
                    </div>

                    <div class="success-message" id="success-message" role="status" aria-live="polite" hidden>
                        Settings saved successfully.
                    </div>
                </section>
            </form>
        </section>
    </main>

    <script src="validation.js"></script>
    <script src="script.js"></script>
</body>

</html>
